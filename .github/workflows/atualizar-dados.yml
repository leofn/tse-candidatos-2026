name: Atualizar Dados TSE

on:
  schedule:
    # Diário às 06:00 UTC (03:00 BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install matplotlib seaborn

      - name: Baixar dados do TSE
        run: python3 scripts/coletar_dados.py --ano 2026 --output ./dados

      - name: Gerar gráficos
        run: python3 scripts/gerar_graficos.py --dados ./dados --output ./graficos

      - name: Commit e push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add dados/ graficos/
          git commit -m "📊 Atualização automática $(date -u +%Y-%m-%d)" || echo "Sem mudanças"
          git push